[package]
name = "wiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Wikipedia browser in the terminal"
license = "MIT"
repository = "https://github.com/batusaribay/wiki"
homepage = "https://github.com/batusaribay/wiki"
readme = "README.md"
keywords = ["wikipedia", "cli", "reader", "terminal"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "wiki"
path = "src/main.rs"

[dependencies]
scraper = "0.29.0"
serde_json = "1"
ureq = { version = "2", features = ["gzip"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[package]
name = "wiki-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Wikipedia searcher in the terminal"
license = "MIT"
repository = "https://github.com/batusaribay/wiki-search"
homepage = "https://github.com/batusaribay/wiki-search"
readme = "README.md"
keywords = ["wikipedia", "cli", "reader", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "wiki-search"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
